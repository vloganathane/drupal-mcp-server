name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        # Bootstrap the advisory's patched pip (eMudhra CA incident):
        # any older pip downloads this wheel while still trusting the
        # compromised roots, so it is pinned by the advisory's checksum.
        python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check src/ tests/

    - name: Type check with mypy
      run: mypy src/drupal_mcp_server/

    - name: Run tests with coverage
      run: |
        # Measure everything and report it, but gate only the code that can be
        # tested without a live Drupal. The large majority of the statements
        # are in the tool modules, which only tests/live/sweep.py can
        # exercise, so a single total threshold is unreachable by construction:
        # even 100% coverage of everything else would total just 25%.
        pytest --cov=src/drupal_mcp_server --cov-report=term-missing --cov-report=xml -v
        coverage report --omit="*/drupal_mcp_server/tools/*" --fail-under=70

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Dependency vulnerability scan
      run: |
        pip install --upgrade "setuptools>=83.0.0"
        pip-audit

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Build package
      run: |
        pip install build
        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
