name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check src/ tests/

    - name: Type check with mypy
      run: mypy src/drupal_mcp_server/

    - name: Run tests with coverage
      run: |
        # Measure everything and report it, but gate only the code that can be
        # tested without a live Drupal. The large majority of the statements
        # are in the tool modules, which only tests/live/sweep.py can
        # exercise, so a single total threshold is unreachable by construction:
        # even 100% coverage of everything else would total just 25%.
        pytest --cov=src/drupal_mcp_server --cov-report=term-missing --cov-report=xml -v
        coverage report --omit="*/drupal_mcp_server/tools/*" --fail-under=70

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Dependency vulnerability scan
      run: |
        pip install --upgrade "setuptools>=83.0.0"
        pip-audit

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build package
      run: |
        pip install build
        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
