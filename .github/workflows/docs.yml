name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'scripts/generate_tool_docs.py'
      - 'src/drupal_mcp_server/tools/**'
      - 'tests/live/sweep-results*.json'
      - 'tests/unit/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'scripts/generate_tool_docs.py'
      - 'src/drupal_mcp_server/tools/**'
      - 'tests/live/sweep-results*.json'
      - 'tests/unit/**'

jobs:
  docs:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages pushes the built site to the gh-pages
    # branch, which requires write access. The repo's default workflow
    # token is read-only, so grant it explicitly here.
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        # Bootstrap the advisory's patched pip (eMudhra CA incident):
        # any older pip downloads while still trusting the compromised
        # roots, so the wheel is pinned by the advisory's checksum.
        python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        pip install mkdocs-material mkdocstrings[python] pyyaml

    - name: Check tool docs are in sync with the code
      run: python scripts/generate_tool_docs.py --check

    - name: Build documentation
      run: mkdocs build --strict

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
