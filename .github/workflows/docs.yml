name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'scripts/generate_tool_docs.py'
      - 'src/drupal_mcp_server/tools/**'
      - 'tests/live/sweep-results*.json'
      - 'tests/unit/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'scripts/generate_tool_docs.py'
      - 'src/drupal_mcp_server/tools/**'
      - 'tests/live/sweep-results*.json'
      - 'tests/unit/**'

jobs:
  docs:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages pushes the built site to the gh-pages
    # branch, which requires write access. The repo's default workflow
    # token is read-only, so grant it explicitly here.
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install mkdocs-material mkdocstrings[python] pyyaml

    - name: Check tool docs are in sync with the code
      run: python scripts/generate_tool_docs.py --check

    - name: Build documentation
      run: mkdocs build --strict

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
